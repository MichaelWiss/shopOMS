# Shopify App Configuration
# Deploy with: npx shopify app deploy

client_id = "65aa6b5b14a7eb88a7eb5879d2743273"
name = "ShopOMS"
application_url = "https://shop-oms.vercel.app"

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,write_orders"

[auth]
redirect_urls = ["https://shop-oms.vercel.app/api/auth/callback"]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://shop-oms.vercel.app/api/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "https://shop-oms.vercel.app/api/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["inventory_levels/update"]
  uri = "https://shop-oms.vercel.app/api/webhooks/inventory/update"
